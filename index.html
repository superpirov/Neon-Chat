<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест кнопки</title>
  <style>
    body { background: #0a0a0f; color: #0ff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { padding: 20px 40px; font-size: 24px; background: transparent; border: 2px solid #0ff; color: #0ff; border-radius: 12px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 18px; text-align: center; }
  </style>
</head>
<body>
  <div>
    <button id="test-btn">НАЖМИ МЕНЯ</button>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById('test-btn').addEventListener('click', function() {
      document.getElementById('result').innerHTML = '✅ КНОПКА РАБОТАЕТ!<br>JavaScript выполняется нормально.';
      this.style.background = '#0ff';
      this.style.color = '#000';
    });
  </script>
</body>
</html>
