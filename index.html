<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neon Messenger</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Диагностическая панель -->
  <div id="diag" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#111;color:#0ff;font-family:monospace;font-size:12px;padding:8px 12px;border-bottom:1px solid #0ff;display:none;"></div>

  <section id="login" class="screen">
    <div class="card neon-card">
      <h1 class="neon-title">NEON CHAT</h1>
      <p class="subtitle">Введи имя для входа</p>
      <input id="login-name" placeholder="Твой никнейм" maxlength="30" autocomplete="off">
      <button id="login-btn" class="neon-btn">ВОЙТИ</button>
      <p id="error-msg" class="error-text" hidden></p>
    </div>
  </section>

  <section id="chat" class="screen" hidden>
    <header class="neon-header">
      <div>
        <h2 class="neon-title-sm">NEON CHAT</h2>
        <p class="user-label">▸ <span id="who"></span></p>
      </div>
      <button id="logout-btn" class="ghost-btn">ВЫХОД</button>
    </header>

    <main id="messages"></main>

    <form id="chat-form" class="neon-form">
      <input
        id="text"
        placeholder="Напиши сообщение..."
        autocomplete="off"
        maxlength="1000"
        required
      >
      <button type="submit" class="send-btn">➤</button>
    </form>
  </section>

  <script src="app.js"></script>

  <!-- ДИАГНОСТИКА -->
  <script>
    (function() {
      var diag = document.getElementById('diag');
      var steps = [];

      function log(msg, ok) {
        steps.push((ok ? '✅ ' : '❌ ') + msg);
        diag.style.display = 'block';
        diag.innerHTML = steps.join('<br>');
      }

      // Шаг 1: DOM готов?
      log('HTML загружен', true);

      // Шаг 2: Supabase JS доступен?
      window.addEventListener('load', function() {
        if (typeof window.supabase !== 'undefined') {
          log('Supabase JS загружен', true);
        } else {
          log('Supabase JS НЕ загружен!', false);
          return;
        }

        // Шаг 3: Элементы найдены?
        var btn = document.getElementById('login-btn');
        var input = document.getElementById('login-name');
        if (btn) {
          log('Кнопка ВОЙТИ найдена', true);
        } else {
          log('Кнопка ВОЙТИ НЕ найдена!', false);
          return;
        }
        if (input) {
          log('Поле имени найдено', true);
        } else {
          log('Поле имени НЕ найдено!', false);
          return;
        }

        // Шаг 4: app.js определил обработчик?
        // Проверяем через временный флаг
        setTimeout(function() {
          // Пробуем программно кликнуть и смотрим реакцию
          var testInput = document.getElementById('login-name');
          if (testInput) {
            testInput.value = 'ТестДиагностики';
          }

          // Проверяем, есть ли у кнопки слушатель — косвенно через localStorage
          var before = localStorage.getItem('messenger_name');
          if (btn) btn.click();
          var after = localStorage.getItem('messenger_name');

          if (after && after !== before) {
            log('Кнопка работает! localStorage обновлён', true);
            // Возвращаем как было
            if (before) {
              localStorage.setItem('messenger_name', before);
            } else {
              localStorage.removeItem('messenger_name');
            }
            location.reload();
          } else {
            log('Кнопка НЕ сработала! app.js не привязал обработчик', false);
            log('Возможно app.js не загрузился или упал с ошибкой', false);
          }
        }, 2000);
      });
    })();
  </script>
</body>
</html>
