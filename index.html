<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neon Messenger</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(15, 15, 25, 0.9);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff00aa;
      --neon-green: #00ff88;
      --text: #e0e0e0;
      --text-dim: #6a6a8a;
      --border: rgba(0, 240, 255, 0.15);
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.1);
      --glow-pink: 0 0 10px rgba(255, 0, 170, 0.4), 0 0 30px rgba(255, 0, 170, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .screen { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; }
    #login { align-items: center; justify-content: center; padding: 20px; }
    .neon-card { width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; display: grid; gap: 16px; backdrop-filter: blur(10px); box-shadow: var(--glow-cyan); }
    .neon-title { font-family: 'Orbitron', sans-serif; font-size: 28px; text-align: center; color: var(--neon-cyan); text-shadow: var(--glow-cyan); letter-spacing: 3px; }
    .subtitle { text-align: center; color: var(--text-dim); font-size: 14px; letter-spacing: 1px; }
    input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,240,255,0.05); color: var(--neon-cyan); font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; transition: all 0.3s ease; }
    input::placeholder { color: var(--text-dim); }
    input:focus { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); background: rgba(0,240,255,0.08); }
    .neon-btn { padding: 14px; border-radius: 10px; border: 1px solid var(--neon-cyan); background: rgba(0,240,255,0.1); color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease; text-shadow: var(--glow-cyan); }
    .neon-btn:hover, .neon-btn:active { background: var(--neon-cyan); color: var(--bg); box-shadow: var(--glow-cyan); }
    .error-text { color: var(--neon-pink); text-align: center; font-size: 13px; text-shadow: var(--glow-pink); min-height: 20px; }
    .success-text { color: var(--neon-green); text-align: center; font-size: 13px; text-shadow: 0 0 8px rgba(0,255,136,0.4); min-height: 20px; }
    .neon-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(10,10,15,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); }
    .neon-title-sm { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--neon-cyan); text-shadow: var(--glow-cyan); letter-spacing: 2px; }
    .user-label { color: var(--neon-green); font-size: 13px; margin-top: 2px; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
    .header-buttons { display: flex; gap: 8px; }
    .ghost-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.3s ease; }
    .ghost-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); text-shadow: var(--glow-pink); }
    .settings-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
    .settings-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
    .message { max-width: 85%; padding: 12px 14px; border-radius: 14px; background: rgba(0,240,255,0.06); border: 1px solid var(--border); word-break: break-word; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message .meta { font-size: 11px; color: var(--neon-green); margin-bottom: 6px; letter-spacing: 0.5px; text-shadow: 0 0 6px rgba(0,255,136,0.3); }
    .message .text-content { color: var(--text); font-size: 15px; line-height: 1.4; }
    .message.mine { align-self: flex-end; border-color: rgba(255,0,170,0.2); background: rgba(255,0,170,0.06); }
    .message.mine .meta { color: var(--neon-pink); text-shadow: 0 0 6px rgba(255,0,170,0.3); }
    .neon-form { display: flex; gap: 10px; padding: 12px; background: rgba(10,10,15,0.95); border-top: 1px solid var(--border); backdrop-filter: blur(10px); }
    .neon-form input { flex: 1; }
    .send-btn { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--neon-cyan); background: rgba(0,240,255,0.1); color: var(--neon-cyan); font-size: 18px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:hover, .send-btn:active { background: var(--neon-cyan); color: var(--bg); box-shadow: var(--glow-cyan); }
    .lock-icon { font-size: 40px; text-align: center; margin-bottom: 8px; }

    /* Модальное окно настроек */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; backdrop-filter: blur(10px); box-shadow: var(--glow-cyan); }
    .modal h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--neon-cyan); text-shadow: var(--glow-cyan); text-align: center; letter-spacing: 2px; }
    .modal p { color: var(--text-dim); font-size: 13px; text-align: center; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons button { flex: 1; }
    .btn-cancel { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-size: 14px; cursor: pointer; }
    .btn-cancel:hover { border-color: var(--neon-pink); color: var(--neon-pink); }
    .btn-save { padding: 12px; border-radius: 10px; border: 1px solid var(--neon-green); background: rgba(0,255,136,0.1); color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
    .btn-save:hover { background: var(--neon-green); color: var(--bg); }
    .modal-msg { text-align: center; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <section id="login" class="screen">
    <div class="card neon-card">
      <div class="lock-icon">🔒</div>
      <h1 class="neon-title">NEON CHAT</h1>
      <p class="subtitle">Введи никнейм и пароль для входа</p>
      <input id="login-name" placeholder="Твой никнейм" maxlength="30" autocomplete="off">
      <input id="login-pass" type="password" placeholder="Пароль" maxlength="50" autocomplete="off">
      <button id="login-btn" class="neon-btn">ВОЙТИ</button>
      <p id="error-msg" class="error-text"></p>
    </div>
  </section>

  <!-- ЭКРАН ЧАТА -->
  <section id="chat" class="screen" style="display:none;">
    <header class="neon-header">
      <div>
        <h2 class="neon-title-sm">NEON CHAT</h2>
        <p class="user-label">▸ <span id="who"></span></p>
      </div>
      <div class="header-buttons">
        <button id="settings-btn" class="settings-btn" title="Сменить пароль">⚙️</button>
        <button id="logout-btn" class="ghost-btn">ВЫХОД</button>
      </div>
    </header>
    <main id="messages"></main>
    <form id="chat-form" class="neon-form">
      <input id="text" placeholder="Напиши сообщение..." autocomplete="off" maxlength="1000" required>
      <button type="submit" class="send-btn">➤</button>
    </form>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО СМЕНЫ ПАРОЛЯ -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h3>⚙️ СМЕНА ПАРОЛЯ</h3>
      <p>Введи новый пароль для входа</p>
      <input id="new-pass" type="password" placeholder="Новый пароль" maxlength="50" autocomplete="off">
      <input id="new-pass-confirm" type="password" placeholder="Повтори новый пароль" maxlength="50" autocomplete="off">
      <p id="modal-msg" class="modal-msg"></p>
      <div class="modal-buttons">
        <button id="modal-cancel" class="btn-cancel">ОТМЕНА</button>
        <button id="modal-save" class="btn-save">СОХРАНИТЬ</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // ОБЩИЙ ПАРОЛЬ ПО УМОЛЧАНИЮ
    // Сообщите его родственникам для первого входа
    // ============================================
    var DEFAULT_PASSWORD = 'neon2025';
    // ============================================

    var SUPABASE_URL = 'https://pocxolhghqxrlaqifxem.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvY3hvbGhnaHF4cmxhcWlmeGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDA4ODQsImV4cCI6MjEwMjExNjg4NH0.NPl_MzneFevI-efp1wSRBIFVVRO5MA0PCmYGVAxABIg';

    var errorMsg = document.getElementById('error-msg');
    var loginBtn = document.getElementById('login-btn');
    var loginName = document.getElementById('login-name');
    var loginPass = document.getElementById('login-pass');
    var logoutBtn = document.getElementById('logout-btn');
    var settingsBtn = document.getElementById('settings-btn');
    var who = document.getElementById('who');
    var messagesEl = document.getElementById('messages');
    var form = document.getElementById('chat-form');
    var textInput = document.getElementById('text');
    var loginSection = document.getElementById('login');
    var chatSection = document.getElementById('chat');
    var modalOverlay = document.getElementById('modal-overlay');
    var newPassInput = document.getElementById('new-pass');
    var newPassConfirm = document.getElementById('new-pass-confirm');
    var modalMsg = document.getElementById('modal-msg');
    var modalCancel = document.getElementById('modal-cancel');
    var modalSave = document.getElementById('modal-save');

    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var userName = localStorage.getItem('messenger_name') || '';
    var userAuth = localStorage.getItem('messenger_auth') || '';
    var seenMessages = {};
    var channel = null;

    // Получить пароль пользователя: личный или общий
    function getUserPassword() {
      return localStorage.getItem('messenger_password') || DEFAULT_PASSWORD;
    }

    function showError(msg) { errorMsg.textContent = msg; }
    function hideError() { errorMsg.textContent = ''; }

    function showChat() {
      loginSection.style.display = 'none';
      chatSection.style.display = 'flex';
      who.textContent = userName;
      startRealtime();
      loadMessages();
    }

    function showLogin() {
      loginSection.style.display = 'flex';
      chatSection.style.display = 'none';
    }

    function startRealtime() {
      if (channel) return;
      channel = client.channel('neon-chat-messages');
      channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function(payload) {
        if (payload && payload.new) addMessage(payload.new, true);
      });
      channel.subscribe();
    }

    async function loadMessages() {
      messagesEl.innerHTML = '';
      seenMessages = {};
      try {
        var result = await client.from('messages').select('*').order('created_at', { ascending: true }).limit(200);
        if (result.error) { showError('Ошибка загрузки: ' + result.error.message); return; }
        if (result.data) {
          for (var i = 0; i < result.data.length; i++) addMessage(result.data[i], false);
        }
      } catch (e) { showError('Ошибка: ' + e.message); }
      scrollToBottom();
    }

    function addMessage(message, scroll) {
      if (!message || !messagesEl) return;
      if (seenMessages[message.id]) return;
      seenMessages[message.id] = true;
      var div = document.createElement('div');
      div.className = 'message';
      if (message.user_name === userName) div.classList.add('mine');
      var meta = document.createElement('div');
      meta.className = 'meta';
      var time = new Date(message.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      meta.textContent = message.user_name + ' \u00b7 ' + time;
      var text = document.createElement('div');
      text.className = 'text-content';
      text.textContent = message.text;
      div.appendChild(meta);
      div.appendChild(text);
      messagesEl.appendChild(div);
      if (scroll !== false) scrollToBottom();
    }

    function scrollToBottom() {
      if (messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // === ВХОД ===
    loginBtn.addEventListener('click', function() {
      var name = loginName.value.trim();
      var pass = loginPass.value.trim();
      if (name.length < 2) { showError('Введите никнейм (минимум 2 символа)'); return; }
      if (pass.length < 1) { showError('Введите пароль'); return; }

      // Проверяем: совпадает ли введённый пароль с личным или общим
      var savedPass = getUserPassword();
      if (pass !== savedPass && pass !== DEFAULT_PASSWORD) {
        showError('❌ Неверный пароль!');
        loginPass.value = '';
        return;
      }

      hideError();
      userName = name;
      localStorage.setItem('messenger_name', userName);
      localStorage.setItem('messenger_auth', 'ok');
      showChat();
    });

    loginName.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); loginPass.focus(); }
    });

    loginPass.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); loginBtn.click(); }
    });

    // === ВЫХОД ===
    logoutBtn.addEventListener('click', function() {
      localStorage.removeItem('messenger_name');
      localStorage.removeItem('messenger_auth');
      location.reload();
    });

    // === НАСТРОЙКИ / СМЕНА ПАРОЛЯ ===
    settingsBtn.addEventListener('click', function() {
      newPassInput.value = '';
      newPassConfirm.value = '';
      modalMsg.textContent = '';
      modalMsg.style.color = '';
      modalOverlay.classList.add('active');
      newPassInput.focus();
    });

    modalCancel.addEventListener('click', function() {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    modalSave.addEventListener('click', function() {
      var p1 = newPassInput.value.trim();
      var p2 = newPassConfirm.value.trim();

      if (p1.length < 2) {
        modalMsg.textContent = 'Пароль минимум 2 символа';
        modalMsg.style.color = '#ff00aa';
        return;
      }
      if (p1 !== p2) {
        modalMsg.textContent = 'Пароли не совпадают!';
        modalMsg.style.color = '#ff00aa';
        return;
      }

      localStorage.setItem('messenger_password', p1);
      modalMsg.textContent = '✅ Пароль сохранён!';
      modalMsg.style.color = '#00ff88';

      setTimeout(function() {
        modalOverlay.classList.remove('active');
      }, 1500);
    });

    newPassConfirm.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); modalSave.click(); }
    });

    // === ОТПРАВКА СООБЩЕНИЯ ===
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      var text = textInput.value.trim();
      if (!text) return;
      try {
        var result = await client.from('messages').insert({ user_name: userName, text: text }).select().single();
        if (result.error) { showError('Ошибка отправки: ' + result.error.message); return; }
        if (result.data) { textInput.value = ''; addMessage(result.data, true); }
      } catch (e) { showError('Ошибка: ' + e.message); }
    });

    // === АВТО-ВХОД ===
    if (userName && userName.length >= 2 && userAuth === 'ok') {
      loginName.value = userName;
      showChat();
    } else {
      localStorage.removeItem('messenger_name');
      localStorage.removeItem('messenger_auth');
      showLogin();
    }
  </script>
</body>
</html>
