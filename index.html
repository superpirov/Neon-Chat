<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neon Messenger</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(15, 15, 25, 0.9);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff00aa;
      --neon-green: #00ff88;
      --text: #e0e0e0;
      --text-dim: #6a6a8a;
      --border: rgba(0, 240, 255, 0.15);
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.1);
      --glow-pink: 0 0 10px rgba(255, 0, 170, 0.4), 0 0 30px rgba(255, 0, 170, 0.1);
      --glow-green: 0 0 10px rgba(0, 255, 136, 0.4), 0 0 30px rgba(0, 255, 136, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .screen { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; }

    /* === LOGIN === */
    #login { align-items: center; justify-content: center; padding: 20px; }
    .neon-card { width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; display: grid; gap: 16px; backdrop-filter: blur(10px); box-shadow: var(--glow-cyan); }
    .neon-title { font-family: 'Orbitron', sans-serif; font-size: 28px; text-align: center; color: var(--neon-cyan); text-shadow: var(--glow-cyan); letter-spacing: 3px; }
    .subtitle { text-align: center; color: var(--text-dim); font-size: 14px; letter-spacing: 1px; }
    input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,240,255,0.05); color: var(--neon-cyan); font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; transition: all 0.3s ease; }
    input::placeholder { color: var(--text-dim); }
    input:focus { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); background: rgba(0,240,255,0.08); }
    .neon-btn { padding: 14px; border-radius: 10px; border: 1px solid var(--neon-cyan); background: rgba(0,240,255,0.1); color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease; text-shadow: var(--glow-cyan); }
    .neon-btn:hover, .neon-btn:active { background: var(--neon-cyan); color: var(--bg); box-shadow: var(--glow-cyan); }
    .btn-secondary { padding: 14px; border-radius: 10px; border: 1px solid var(--neon-green); background: rgba(0,255,136,0.1); color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease; text-shadow: var(--glow-green); }
    .btn-secondary:hover { background: var(--neon-green); color: var(--bg); }
    .error-text { color: var(--neon-pink); text-align: center; font-size: 13px; text-shadow: var(--glow-pink); min-height: 20px; }
    .lock-icon { font-size: 40px; text-align: center; margin-bottom: 8px; }
    .login-toggle { text-align: center; color: var(--text-dim); font-size: 13px; cursor: pointer; }
    .login-toggle span { color: var(--neon-cyan); text-decoration: underline; }

    /* === HEADER === */
    .neon-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(10,10,15,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); }
    .neon-title-sm { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--neon-cyan); text-shadow: var(--glow-cyan); letter-spacing: 2px; }
    .user-label { color: var(--neon-green); font-size: 13px; margin-top: 2px; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
    .header-buttons { display: flex; gap: 6px; align-items: center; }
    .ghost-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.3s ease; }
    .ghost-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); text-shadow: var(--glow-pink); }
    .settings-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
    .settings-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
    .add-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--neon-green); background: rgba(0,255,136,0.1); color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-shadow: var(--glow-green); }
    .add-btn:hover { background: var(--neon-green); color: var(--bg); }

    /* === CONTACTS === */
    #contacts-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    #contacts-list::-webkit-scrollbar { width: 4px; }
    #contacts-list::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
    .contact-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,240,255,0.04); cursor: pointer; transition: all 0.3s ease; position: relative; }
    .contact-item:hover, .contact-item:active { border-color: var(--neon-cyan); background: rgba(0,240,255,0.08); box-shadow: var(--glow-cyan); }
    .contact-avatar-wrap { position: relative; flex-shrink: 0; }
    .contact-avatar { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--neon-cyan); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--neon-cyan); text-shadow: var(--glow-cyan); background: rgba(0,240,255,0.05); }
    .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); }
    .online-dot.online { background: var(--neon-green); box-shadow: 0 0 6px rgba(0,255,136,0.6); }
    .online-dot.offline { background: var(--text-dim); }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 16px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-last-msg { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .contact-time { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .no-contacts { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; line-height: 1.6; }

    /* === CHAT === */
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
    .message { max-width: 85%; padding: 12px 14px; border-radius: 14px; background: rgba(0,240,255,0.06); border: 1px solid var(--border); word-break: break-word; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message .meta { font-size: 11px; color: var(--neon-green); margin-bottom: 6px; letter-spacing: 0.5px; text-shadow: 0 0 6px rgba(0,255,136,0.3); }
    .message .text-content { color: var(--text); font-size: 15px; line-height: 1.4; }
    .message.mine { align-self: flex-end; border-color: rgba(255,0,170,0.2); background: rgba(255,0,170,0.06); }
    .message.mine .meta { color: var(--neon-pink); text-shadow: 0 0 6px rgba(255,0,170,0.3); }
    .neon-form { display: flex; gap: 10px; padding: 12px; background: rgba(10,10,15,0.95); border-top: 1px solid var(--border); backdrop-filter: blur(10px); }
    .neon-form input { flex: 1; }
    .send-btn { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--neon-cyan); background: rgba(0,240,255,0.1); color: var(--neon-cyan); font-size: 18px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:hover, .send-btn:active { background: var(--neon-cyan); color: var(--bg); box-shadow: var(--glow-cyan); }
    .back-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--neon-cyan); font-family: 'Rajdhani', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.3s ease; }
    .back-btn:hover { border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); }

    /* === MODAL === */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { width: 100%; max-width: 380px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; backdrop-filter: blur(10px); box-shadow: var(--glow-cyan); max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--neon-cyan); text-shadow: var(--glow-cyan); text-align: center; letter-spacing: 2px; }
    .modal p { color: var(--text-dim); font-size: 13px; text-align: center; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons button { flex: 1; }
    .btn-cancel { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-size: 14px; cursor: pointer; }
    .btn-cancel:hover { border-color: var(--neon-pink); color: var(--neon-pink); }
    .btn-save { padding: 12px; border-radius: 10px; border: 1px solid var(--neon-green); background: rgba(0,255,136,0.1); color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
    .btn-save:hover { background: var(--neon-green); color: var(--bg); }
    .modal-msg { text-align: center; font-size: 13px; min-height: 18px; }

    /* Toggle switch */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .toggle-label { color: var(--text); font-size: 14px; }
    .toggle-switch { position: relative; width: 48px; height: 26px; cursor: pointer; }
    .toggle-switch input { display: none; }
    .toggle-slider { position: absolute; inset: 0; background: var(--text-dim); border-radius: 26px; transition: 0.3s; }
    .toggle-slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; bottom: 3px; background: var(--bg); border-radius: 50%; transition: 0.3s; }
    .toggle-switch input:checked + .toggle-slider { background: var(--neon-green); box-shadow: 0 0 8px rgba(0,255,136,0.4); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(22px); }
  </style>
</head>
<body>

  <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
  <section id="login" class="screen">
    <div class="card neon-card">
      <div class="lock-icon">🔒</div>
      <h1 class="neon-title">NEON CHAT</h1>
      <p class="subtitle" id="login-subtitle">Вход в мессенджер</p>
      <input id="login-name" placeholder="Никнейм" maxlength="30" autocomplete="off">
      <input id="login-pass" type="password" placeholder="Пароль" maxlength="50" autocomplete="off">
      <button id="login-btn" class="neon-btn">ВОЙТИ</button>
      <button id="register-btn" class="btn-secondary" style="display:none;">ЗАРЕГИСТРИРОВАТЬСЯ</button>
      <p id="error-msg" class="error-text"></p>
      <p class="login-toggle" id="toggle-mode">Нет аккаунта? <span id="toggle-link">Зарегистрироваться</span></p>
    </div>
  </section>

  <!-- СПИСОК КОНТАКТОВ -->
  <section id="contacts" class="screen" style="display:none;">
    <header class="neon-header">
      <div>
        <h2 class="neon-title-sm">NEON CHAT</h2>
        <p class="user-label">▸ <span id="who"></span></p>
      </div>
      <div class="header-buttons">
        <button id="add-contact-btn" class="add-btn">+ Добавить</button>
        <button id="settings-btn" class="settings-btn" title="Настройки">⚙️</button>
        <button id="logout-btn" class="ghost-btn">ВЫХОД</button>
      </div>
    </header>
    <div id="contacts-list"></div>
  </section>

  <!-- ЛИЧНЫЙ ЧАТ -->
  <section id="chat" class="screen" style="display:none;">
    <header class="neon-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="back-btn" class="back-btn">← Назад</button>
        <div>
          <h2 class="neon-title-sm" id="chat-with"></h2>
        </div>
      </div>
    </header>
    <main id="messages"></main>
    <form id="chat-form" class="neon-form">
      <input id="text" placeholder="Напиши сообщение..." autocomplete="off" maxlength="1000" required>
      <button type="submit" class="send-btn">➤</button>
    </form>
  </section>

  <!-- МОДАЛКА: ДОБАВИТЬ КОНТАКТ -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal">
      <h3>+ ДОБАВИТЬ КОНТАКТ</h3>
      <p>Введи никнейм человека</p>
      <input id="add-nickname" placeholder="Никнейм" maxlength="30" autocomplete="off">
      <p id="add-msg" class="modal-msg"></p>
      <div class="modal-buttons">
        <button id="add-cancel" class="btn-cancel">ОТМЕНА</button>
        <button id="add-save" class="btn-save">ДОБАВИТЬ</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: НАСТРОЙКИ -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal">
      <h3>⚙️ НАСТРОЙКИ</h3>

      <div class="toggle-row">
        <span class="toggle-label">🔔 Уведомления</span>
        <label class="toggle-switch">
          <input type="checkbox" id="notif-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p id="notif-status" style="font-size:12px;text-align:center;color:var(--text-dim);min-height:16px;"></p>

      <div class="toggle-row">
        <span class="toggle-label">🔑 Сменить пароль</span>
      </div>
      <input id="new-pass" type="password" placeholder="Новый пароль" maxlength="50" autocomplete="off">
      <input id="new-pass-confirm" type="password" placeholder="Повтори пароль" maxlength="50" autocomplete="off">
      <p id="pass-msg" class="modal-msg"></p>

      <div class="modal-buttons">
        <button id="settings-close" class="btn-cancel">ЗАКРЫТЬ</button>
        <button id="pass-save" class="btn-save">СОХРАНИТЬ ПАРОЛЬ</button>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://pocxolhghqxrlaqifxem.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvY3hvbGhnaHF4cmxhcWlmeGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDA4ODQsImV4cCI6MjEwMjExNjg4NH0.NPl_MzneFevI-efp1wSRBIFVVRO5MA0PCmYGVAxABIg';

    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Элементы
    var loginSection = document.getElementById('login');
    var contactsSection = document.getElementById('contacts');
    var chatSection = document.getElementById('chat');
    var loginBtn = document.getElementById('login-btn');
    var registerBtn = document.getElementById('register-btn');
    var loginNameEl = document.getElementById('login-name');
    var loginPassEl = document.getElementById('login-pass');
    var loginSubtitle = document.getElementById('login-subtitle');
    var toggleLink = document.getElementById('toggle-link');
    var errorMsg = document.getElementById('error-msg');
    var who = document.getElementById('who');
    var contactsList = document.getElementById('contacts-list');
    var messagesEl = document.getElementById('messages');
    var form = document.getElementById('chat-form');
    var textInput = document.getElementById('text');
    var chatWith = document.getElementById('chat-with');
    var backBtn = document.getElementById('back-btn');
    var logoutBtn = document.getElementById('logout-btn');
    var settingsBtn = document.getElementById('settings-btn');
    var addContactBtn = document.getElementById('add-contact-btn');

    var addModal = document.getElementById('add-modal');
    var addNickname = document.getElementById('add-nickname');
    var addMsg = document.getElementById('add-msg');
    var addCancel = document.getElementById('add-cancel');
    var addSave = document.getElementById('add-save');

    var settingsModal = document.getElementById('settings-modal');
    var notifToggle = document.getElementById('notif-toggle');
    var notifStatus = document.getElementById('notif-status');
    var newPassInput = document.getElementById('new-pass');
    var newPassConfirm = document.getElementById('new-pass-confirm');
    var passMsg = document.getElementById('pass-msg');
    var settingsClose = document.getElementById('settings-close');
    var passSave = document.getElementById('pass-save');

    var currentUser = null;
    var currentChatUserId = null;
    var seenMessages = {};
    var channel = null;
    var presenceChannel = null;
    var isRegisterMode = false;
    var onlineUsers = {};
    var presenceInterval = null;
    var swRegistration = null;

    function showError(msg) { errorMsg.textContent = msg; }
    function hideError() { errorMsg.textContent = ''; }

    function showScreen(name) {
      loginSection.style.display = name === 'login' ? 'flex' : 'none';
      contactsSection.style.display = name === 'contacts' ? 'flex' : 'none';
      chatSection.style.display = name === 'chat' ? 'flex' : 'none';
    }

    // =============================================
    // УВЕДОМЛЕНИЯ
    // =============================================
    function areNotificationsEnabled() {
      return localStorage.getItem('neon_notif_enabled') === 'true';
    }

    function setNotificationsEnabled(val) {
      localStorage.setItem('neon_notif_enabled', val ? 'true' : 'false');
    }

    async function initServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        notifStatus.textContent = 'Браузер не поддерживает уведомления';
        return;
      }
      try {
        swRegistration = await navigator.serviceWorker.register('/Neon-Chat/sw.js');
      } catch (e) {
        console.error('SW error:', e);
      }
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        notifStatus.textContent = 'Браузер не поддерживает уведомления';
        return false;
      }
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') {
        notifStatus.textContent = 'Уведомления заблокированы в браузере';
        return false;
      }
      var result = await Notification.requestPermission();
      return result === 'granted';
    }

    function showLocalNotification(title, body) {
      if (!areNotificationsEnabled()) return;
      if (Notification.permission !== 'granted') return;
      try {
        new Notification(title, {
          body: body,
          icon: 'https://superpirov.github.io/Neon-Chat/icon.png',
          tag: 'neon-chat-' + Date.now(),
          vibrate: [200, 100, 200]
        });
      } catch (e) {
        console.error('Notification error:', e);
      }
    }

    // Toggle notifications
    notifToggle.addEventListener('change', async function() {
      if (notifToggle.checked) {
        var granted = await requestNotificationPermission();
        if (granted) {
          setNotificationsEnabled(true);
          notifStatus.textContent = '✅ Уведомления включены';
          notifStatus.style.color = '#00ff88';
          // Тестовое уведомление
          showLocalNotification('Neon Chat', 'Уведомления работают! 🔔');
        } else {
          notifToggle.checked = false;
          setNotificationsEnabled(false);
          notifStatus.textContent = '❌ Разрешите уведомления в браузере';
          notifStatus.style.color = '#ff00aa';
        }
      } else {
        setNotificationsEnabled(false);
        notifStatus.textContent = 'Уведомления отключены';
        notifStatus.style.color = '#6a6a8a';
      }
    });

    // =============================================
    // ОНЛАЙН-СТАТУС
    // =============================================
    async function updatePresence() {
      if (!currentUser) return;
      try {
        await client.from('user_presence').upsert({
          user_id: currentUser.id,
          last_seen: new Date().toISOString()
        }, { onConflict: 'user_id' });
      } catch (e) { console.error('Presence error:', e); }
    }

    async function loadOnlineStatuses(userIds) {
      if (!userIds || userIds.length === 0) return {};
      try {
        var result = await client.from('user_presence').select('*').in('user_id', userIds);
        if (result.error) return {};
        var statuses = {};
        var now = Date.now();
        for (var i = 0; i < result.data.length; i++) {
          var p = result.data[i];
          var diff = now - new Date(p.last_seen).getTime();
          statuses[p.user_id] = diff < 60000; // онлайн если был активен последние 60 сек
        }
        return statuses;
      } catch (e) { return {}; }
    }

    function startPresenceHeartbeat() {
      updatePresence();
      if (presenceInterval) clearInterval(presenceInterval);
      presenceInterval = setInterval(updatePresence, 20000);
    }

    // =============================================
    // ПЕРЕКЛЮЧЕНИЕ ВХОД / РЕГИСТРАЦИЯ
    // =============================================
    toggleLink.addEventListener('click', function() {
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        loginSubtitle.textContent = 'Регистрация';
        loginBtn.style.display = 'none';
        registerBtn.style.display = 'block';
        toggleLink.textContent = 'Войти';
        document.querySelector('.login-toggle').childNodes[0].textContent = 'Уже есть аккаунт? ';
      } else {
        loginSubtitle.textContent = 'Вход в мессенджер';
        loginBtn.style.display = 'block';
        registerBtn.style.display = 'none';
        toggleLink.textContent = 'Зарегистрироваться';
        document.querySelector('.login-toggle').childNodes[0].textContent = 'Нет аккаунта? ';
      }
      hideError();
    });

    // === РЕГИСТРАЦИЯ ===
    registerBtn.addEventListener('click', async function() {
      var name = loginNameEl.value.trim();
      var pass = loginPassEl.value.trim();
      if (name.length < 2) { showError('Никнейм минимум 2 символа'); return; }
      if (pass.length < 2) { showError('Пароль минимум 2 символа'); return; }
      try {
        var result = await client.from('users').insert({ nickname: name, password_hash: pass }).select().single();
        if (result.error) {
          if (result.error.code === '23505') { showError('Этот никнейм уже занят!'); }
          else { showError('Ошибка: ' + result.error.message); }
          return;
        }
        currentUser = result.data;
        localStorage.setItem('messenger_user', JSON.stringify(currentUser));
        enterApp();
      } catch (e) { showError('Ошибка: ' + e.message); }
    });

    // === ВХОД ===
    loginBtn.addEventListener('click', async function() {
      var name = loginNameEl.value.trim();
      var pass = loginPassEl.value.trim();
      if (name.length < 2) { showError('Введите никнейм'); return; }
      if (pass.length < 1) { showError('Введите пароль'); return; }
      try {
        var result = await client.from('users').select('*').eq('nickname', name).single();
        if (result.error || !result.data) { showError('Пользователь не найден'); return; }
        if (result.data.password_hash !== pass) { showError('❌ Неверный пароль!'); loginPassEl.value = ''; return; }
        currentUser = result.data;
        localStorage.setItem('messenger_user', JSON.stringify(currentUser));
        enterApp();
      } catch (e) { showError('Ошибка: ' + e.message); }
    });

    loginNameEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); loginPassEl.focus(); } });
    loginPassEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); if (isRegisterMode) registerBtn.click(); else loginBtn.click(); } });

    function enterApp() {
      who.textContent = currentUser.nickname;
      showScreen('contacts');
      loadContacts();
      startRealtime();
      startPresenceHeartbeat();
      initServiceWorker();

      // Установить состояние toggle
      notifToggle.checked = areNotificationsEnabled();
      if (areNotificationsEnabled() && Notification.permission === 'granted') {
        notifStatus.textContent = '✅ Уведомления включены';
        notifStatus.style.color = '#00ff88';
      } else if (areNotificationsEnabled()) {
        notifStatus.textContent = 'Разрешите уведомления в браузере';
        notifStatus.style.color = '#ffe600';
      } else {
        notifStatus.textContent = 'Уведомления отключены';
        notifStatus.style.color = '#6a6a8a';
      }
    }

    // === КОНТАКТЫ ===
    async function loadContacts() {
      contactsList.innerHTML = '<div class="no-contacts">Загрузка...</div>';
      try {
        var contactsResult = await client.from('contacts').select('contact_id').eq('user_id', currentUser.id);
        if (contactsResult.error) { contactsList.innerHTML = '<div class="no-contacts">Ошибка загрузки</div>'; return; }

        if (!contactsResult.data || contactsResult.data.length === 0) {
          contactsList.innerHTML = '<div class="no-contacts">У тебя пока нет контактов.<br><br>Нажми <b style="color:#00ff88">+ Добавить</b> и введи никнейм человека.</div>';
          return;
        }

        var contactIds = contactsResult.data.map(function(c) { return c.contact_id; });
        var usersResult = await client.from('users').select('*').in('id', contactIds).order('nickname', { ascending: true });
        if (usersResult.error) { contactsList.innerHTML = '<div class="no-contacts">Ошибка</div>'; return; }

        // Загрузить онлайн-статусы
        var onlineStatuses = await loadOnlineStatuses(contactIds);

        contactsList.innerHTML = '';
        for (var i = 0; i < usersResult.data.length; i++) {
          var user = usersResult.data[i];
          var lastMsg = await getLastMessage(user.id);
          var isOnline = onlineStatuses[user.id] || false;

          var div = document.createElement('div');
          div.className = 'contact-item';
          div.innerHTML =
            '<div class="contact-avatar-wrap">' +
              '<div class="contact-avatar">' + escapeHtml(user.nickname.charAt(0).toUpperCase()) + '</div>' +
              '<div class="online-dot ' + (isOnline ? 'online' : 'offline') + '"></div>' +
            '</div>' +
            '<div class="contact-info">' +
              '<div class="contact-name">' + escapeHtml(user.nickname) + (isOnline ? ' <span style="color:#00ff88;font-size:11px;">онлайн</span>' : '') + '</div>' +
              '<div class="contact-last-msg">' + (lastMsg ? escapeHtml(lastMsg.text.substring(0, 40)) : 'Нет сообщений') + '</div>' +
            '</div>' +
            '<div class="contact-time">' + (lastMsg ? formatTime(lastMsg.created_at) : '') + '</div>';
          div.addEventListener('click', (function(u) { return function() { openChat(u); }; })(user));
          contactsList.appendChild(div);
        }
      } catch (e) { contactsList.innerHTML = '<div class="no-contacts">Ошибка: ' + escapeHtml(e.message) + '</div>'; }
    }

    async function getLastMessage(otherUserId) {
      try {
        var result = await client.from('private_messages')
          .select('*')
          .or('and(sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + otherUserId + '),and(sender_id.eq.' + otherUserId + ',receiver_id.eq.' + currentUser.id + ')')
          .order('created_at', { ascending: false })
          .limit(1);
        if (result.data && result.data.length > 0) return result.data[0];
      } catch (e) {}
      return null;
    }

    function formatTime(dateStr) {
      return new Date(dateStr).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // === ДОБАВИТЬ КОНТАКТ ===
    addContactBtn.addEventListener('click', function() {
      addNickname.value = '';
      addMsg.textContent = '';
      addModal.classList.add('active');
      addNickname.focus();
    });

    addCancel.addEventListener('click', function() { addModal.classList.remove('active'); });
    addModal.addEventListener('click', function(e) { if (e.target === addModal) addModal.classList.remove('active'); });

    addSave.addEventListener('click', async function() {
      var nickname = addNickname.value.trim();
      if (nickname.length < 2) { addMsg.textContent = 'Введи никнейм'; addMsg.style.color = '#ff00aa'; return; }
      if (nickname === currentUser.nickname) { addMsg.textContent = 'Нельзя добавить себя'; addMsg.style.color = '#ff00aa'; return; }
      try {
        var userResult = await client.from('users').select('id').eq('nickname', nickname).single();
        if (userResult.error || !userResult.data) { addMsg.textContent = 'Пользователь не найден'; addMsg.style.color = '#ff00aa'; return; }
        var existResult = await client.from('contacts').select('id').eq('user_id', currentUser.id).eq('contact_id', userResult.data.id).single();
        if (existResult.data) { addMsg.textContent = 'Уже в контактах!'; addMsg.style.color = '#ffe600'; return; }
        var insertResult = await client.from('contacts').insert({ user_id: currentUser.id, contact_id: userResult.data.id }).select().single();
        if (insertResult.error) { addMsg.textContent = 'Ошибка: ' + insertResult.error.message; addMsg.style.color = '#ff00aa'; return; }
        addMsg.textContent = '✅ Добавлен!';
        addMsg.style.color = '#00ff88';
        setTimeout(function() { addModal.classList.remove('active'); loadContacts(); }, 1000);
      } catch (e) { addMsg.textContent = 'Ошибка: ' + e.message; addMsg.style.color = '#ff00aa'; }
    });

    addNickname.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); addSave.click(); } });

    // === ОТКРЫТЬ ЧАТ ===
    function openChat(user) {
      currentChatUserId = user.id;
      chatWith.textContent = user.nickname;
      showScreen('chat');
      seenMessages = {};
      messagesEl.innerHTML = '';
      loadPrivateMessages();
    }

    backBtn.addEventListener('click', function() {
      currentChatUserId = null;
      showScreen('contacts');
      loadContacts();
    });

    async function loadPrivateMessages() {
      try {
        var result = await client.from('private_messages')
          .select('*')
          .or('and(sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentChatUserId + '),and(sender_id.eq.' + currentChatUserId + ',receiver_id.eq.' + currentUser.id + ')')
          .order('created_at', { ascending: true })
          .limit(200);
        if (result.error) { console.error(result.error); return; }
        if (result.data) {
          for (var i = 0; i < result.data.length; i++) addMessage(result.data[i], false);
        }
      } catch (e) { console.error(e); }
      scrollToBottom();
    }

    function addMessage(message, scroll) {
      if (!message || !messagesEl) return;
      if (seenMessages[message.id]) return;
      seenMessages[message.id] = true;
      var div = document.createElement('div');
      div.className = 'message';
      if (message.sender_id === currentUser.id) div.classList.add('mine');
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = formatTime(message.created_at);
      var text = document.createElement('div');
      text.className = 'text-content';
      text.textContent = message.text;
      div.appendChild(meta);
      div.appendChild(text);
      messagesEl.appendChild(div);
      if (scroll !== false) scrollToBottom();
    }

    function scrollToBottom() { if (messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight; }

    // === ОТПРАВКА ===
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      var text = textInput.value.trim();
      if (!text || !currentChatUserId) return;
      try {
        var result = await client.from('private_messages').insert({
          sender_id: currentUser.id,
          receiver_id: currentChatUserId,
          text: text
        }).select().single();
        if (result.error) { console.error(result.error); return; }
        if (result.data) { textInput.value = ''; addMessage(result.data, true); }
      } catch (e) { console.error(e); }
    });

    // === REALTIME ===
    function startRealtime() {
      if (channel) return;
      channel = client.channel('neon-private-v3');
      channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, function(payload) {
        if (!payload || !payload.new) return;
        var msg = payload.new;

        // Сообщение для текущего чата
        var isForCurrentChat = (msg.receiver_id === currentUser.id && msg.sender_id === currentChatUserId) ||
                               (msg.sender_id === currentUser.id && msg.receiver_id === currentChatUserId);
        if (isForCurrentChat && currentChatUserId) {
          addMessage(msg, true);
        }

        // Уведомление если сообщение не от меня и я не в этом чате
        if (msg.sender_id !== currentUser.id && msg.receiver_id === currentUser.id) {
          if (!currentChatUserId || msg.sender_id !== currentChatUserId) {
            // Получить имя отправителя
            client.from('users').select('nickname').eq('id', msg.sender_id).single().then(function(r) {
              var senderName = (r.data && r.data.nickname) ? r.data.nickname : 'Неизвестный';
              showLocalNotification(senderName, msg.text.substring(0, 100));
            });
          }
        }

        // Обновить контакты
        if (contactsSection.style.display !== 'none') loadContacts();
      });

      // Realtime для онлайн-статусов
      channel.on('postgres_changes', { event: '*', schema: 'public', table: 'user_presence' }, function() {
        if (contactsSection.style.display !== 'none') loadContacts();
      });

      channel.subscribe();
    }

    // === НАСТРОЙКИ ===
    settingsBtn.addEventListener('click', function() {
      newPassInput.value = '';
      newPassConfirm.value = '';
      passMsg.textContent = '';
      notifToggle.checked = areNotificationsEnabled();
      settingsModal.classList.add('active');
    });

    settingsClose.addEventListener('click', function() { settingsModal.classList.remove('active'); });
    settingsModal.addEventListener('click', function(e) { if (e.target === settingsModal) settingsModal.classList.remove('active'); });

    passSave.addEventListener('click', async function() {
      var p1 = newPassInput.value.trim();
      var p2 = newPassConfirm.value.trim();
      if (p1.length < 2) { passMsg.textContent = 'Минимум 2 символа'; passMsg.style.color = '#ff00aa'; return; }
      if (p1 !== p2) { passMsg.textContent = 'Пароли не совпадают!'; passMsg.style.color = '#ff00aa'; return; }
      try {
        var result = await client.from('users').update({ password_hash: p1 }).eq('id', currentUser.id).select().single();
        if (result.error) { passMsg.textContent = 'Ошибка: ' + result.error.message; passMsg.style.color = '#ff00aa'; return; }
        currentUser.password_hash = p1;
        localStorage.setItem('messenger_user', JSON.stringify(currentUser));
        passMsg.textContent = '✅ Пароль сохранён!';
        passMsg.style.color = '#00ff88';
        setTimeout(function() { passMsg.textContent = ''; }, 2000);
      } catch (e) { passMsg.textContent = 'Ошибка: ' + e.message; passMsg.style.color = '#ff00aa'; }
    });

    newPassConfirm.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); passSave.click(); } });

    // === ВЫХОД ===
    logoutBtn.addEventListener('click', function() {
      if (presenceInterval) clearInterval(presenceInterval);
      localStorage.removeItem('messenger_user');
      location.reload();
    });

    // === АВТО-ВХОД ===
    var savedUser = localStorage.getItem('messenger_user');
    if (savedUser) {
      try {
        currentUser = JSON.parse(savedUser);
        enterApp();
      } catch (e) {
        localStorage.removeItem('messenger_user');
        showScreen('login');
      }
    } else {
      showScreen('login');
    }
  </script>
</body>
</html>
